services:
  - type: web
    name: fasalmitra-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python backend/manage.py migrate
    startCommand: gunicorn --chdir backend fasalmitra.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: False
